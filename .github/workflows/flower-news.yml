name: 화훼 뉴스 아침 브리핑

on:
  schedule:
    # 23:00 UTC = 익일 08:00 KST, 월~금(KST). (UTC 요일 0~4)
    - cron: "0 23 * * 0-4"
  workflow_dispatch:
    inputs:
      force:
        description: "공휴일 게이트/중복방지 무시하고 강제 발송"
        type: boolean
        default: false

# news_data 아카이브를 레포에 커밋(push)하기 위해 쓰기 권한 필요
permissions:
  contents: write

concurrency:
  group: flower-news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 발송일 판별
        id: gate
        env:
          HOLIDAY_SERVICE_KEY: ${{ secrets.HOLIDAY_SERVICE_KEY }}
        run: python news_holiday.py --github

      - name: 발송일 아님 → 종료
        if: steps.gate.outputs.skip == 'true' && github.event.inputs.force != 'true'
        run: echo "오늘은 발송하지 않음 (${{ steps.gate.outputs.reason }})"

      - name: Node 설정
        if: steps.gate.outputs.skip != 'true' || github.event.inputs.force == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Claude Code 설치
        if: steps.gate.outputs.skip != 'true' || github.event.inputs.force == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: 중복방지 상태 복원
        if: steps.gate.outputs.skip != 'true' || github.event.inputs.force == 'true'
        uses: actions/cache@v4
        with:
          path: news_last_sent.txt
          key: news-last-sent-${{ github.run_id }}
          restore-keys: |
            news-last-sent-

      - name: 뉴스 생성 (Claude 구독 · 웹검색 → JSON)
        if: steps.gate.outputs.skip != 'true' || github.event.inputs.force == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          TODAY="$(TZ=Asia/Seoul date '+%Y년 %m월 %d일 (%a)')"
          PROMPT="오늘은 ${TODAY} 입니다.

          $(cat news_prompt.md)"
          echo "::group::생성 중"
          claude -p "$PROMPT" \
            --allowedTools "WebSearch" "WebFetch" \
            --output-format text > raw.json || { echo "claude 실행 실패"; exit 1; }
          echo "::endgroup::"
          echo "----- 원본(JSON) -----"; cat raw.json

      - name: 아카이브 + 잔디 발송본 생성
        if: steps.gate.outputs.skip != 'true' || github.event.inputs.force == 'true'
        env:
          NEWS_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/news/
        run: python news_build.py raw.json --data-dir news_data --jandi-out jandi.txt

      - name: 아카이브 커밋(push)
        if: steps.gate.outputs.skip != 'true' || github.event.inputs.force == 'true'
        run: |
          git config user.name "flower-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news_data
          if git diff --cached --quiet; then
            echo "아카이브 변경 없음"
          else
            git commit -m "뉴스 아카이브 업데이트: $(TZ=Asia/Seoul date +%F)"
            git pull --rebase origin main || true
            git push
          fi

      - name: 잔디 발송
        if: steps.gate.outputs.skip != 'true' || github.event.inputs.force == 'true'
        env:
          JANDI_NEWS_WEBHOOK_URL: ${{ secrets.JANDI_NEWS_WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python news_send_jandi.py jandi.txt --force
          else
            python news_send_jandi.py jandi.txt
          fi
