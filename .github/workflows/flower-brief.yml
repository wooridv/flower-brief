name: 화훼 아침 브리핑

on:
  workflow_dispatch: {}   # 비상 수동 실행 전용; 정기 실행은 통합 워크플로가 담당

# GitHub Pages 배포 권한
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 실행 방지
concurrency:
  group: flower-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # last_sent.txt 를 실행 간 유지(중복 발송 방지 상태값).
      # key 는 매 실행 고유 → 항상 새로 저장, restore-keys 로 직전 값 복원.
      - name: 상태 복원
        uses: actions/cache@v4
        with:
          path: last_sent.txt
          key: last-sent-${{ github.run_id }}
          restore-keys: |
            last-sent-

      - name: 브리핑 실행
        env:
          FLOWER_SERVICE_KEY: ${{ secrets.FLOWER_SERVICE_KEY }}
          JANDI_AUCTION_WEBHOOK_URL: ${{ secrets.JANDI_AUCTION_WEBHOOK_URL }}
          # 대시보드 공개 URL(프로젝트 페이지 기본 형식) → 잔디 링크에 사용
          REPORT_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          BACKFILL_DAYS: "20"   # 대시보드에서 과거 몇 경매일치를 볼지
        run: python brief.py --out site

      # site/ 가 비어있을 수 있으므로(경매 데이터 없을 때) 최소 파일 보장
      - name: 리포트 폴더 보장
        run: |
          mkdir -p site
          [ -f site/index.html ] || echo '<!doctype html><meta charset="utf-8"><p>아직 브리핑이 없습니다.</p>' > site/index.html

      - name: 화훼업계뉴스 페이지 보존
        run: |
          python agri-briefing-site/scripts/build_site.py
          mkdir -p site/assets site/data site/archive site/briefing site/industry
          cp -R agri-briefing-site/assets/. site/assets/
          cp -R agri-briefing-site/data/. site/data/
          cp -R agri-briefing-site/archive/. site/archive/
          cp -R agri-briefing-site/briefing/. site/briefing/
          cp -R agri-briefing-site/industry/. site/industry/

      - name: Pages 아티팩트 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: GitHub Pages 배포
        id: deploy
        uses: actions/deploy-pages@v4
